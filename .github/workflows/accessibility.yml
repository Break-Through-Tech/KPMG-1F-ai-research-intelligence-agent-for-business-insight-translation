name: Fixture accessibility regression

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'src/research_demo.py'
      - 'src/research_contracts.py'
      - 'src/paper_conversation.py'
      - 'src/paper_html.py'
      - 'src/paper_reader.py'
      - 'tests/source_reader_fixture.py'
      - 'tests/test_paper_reader.py'
      - 'tests/fixtures/research/**'
      - 'tests/browser/**'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      # Parser-produced synthetic source fixture; no model/index dependencies.
      - run: python -m pip install beautifulsoup4 jsonschema
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-accessibility-evidence
          path: tests/browser/artifacts/
          retention-days: 14
