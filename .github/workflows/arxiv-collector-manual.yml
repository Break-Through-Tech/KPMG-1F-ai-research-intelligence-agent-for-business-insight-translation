name: arXiv candidate collection (manual prototype)
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'UTC start date, inclusive (YYYY-MM-DD)'
        required: true
      until:
        description: 'UTC end date, exclusive (YYYY-MM-DD)'
        required: true
      category:
        default: cs.AI
        required: true
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Collect metadata only into separate candidates
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          CATEGORY: ${{ inputs.category }}
        run: >-
          python -m src.arxiv_collection --since "$SINCE" --until "$UNTIL"
          --category "$CATEGORY" --max-results 25 --output candidate-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-candidates
          path: candidate-output/
